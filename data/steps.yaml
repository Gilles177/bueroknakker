  tips_de:
    - 12 Monate an aktuelle Kasse gebunden, dann mit 2 Monaten Kündigungsfrist wechselbar.
    - Zusatzbeitrag variiert (0,5–2,5 %); Wechsel kann hunderte Euro pro Jahr sparen.
  link: https://www.gesetzlichekrankenkassen.de/
  source_urls:
    - https://www.bundesgesundheitsministerium.de/

