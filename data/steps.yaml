- id: krankenkasse_wechsel
  title_de: Krankenkasse wechseln
  title_en: Switch health insurance
  category: health
  description_de: Wechsel der gesetzlichen Krankenkasse bei besserem Angebot.
  description_en: Switch public health insurer if a better offer exists.
  applies_to:
    status: [EU citizen, Non-EU employee]
  deadline_days: 365
  duration_days: 14
  cost_eur_min: 0
  cost_eur_max: 0
  difficulty: 2
  priority: 5
  channel: mail
  depends_on: [health_insurance_activation]
  documents:
    - Current insurance card
    - Employment contract
    - Bank details
  tips_en:
    - Bound to your current insurer for 12 months, then can switch with 2 months' notice.
