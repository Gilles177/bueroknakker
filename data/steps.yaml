# BüroKnakker — German bureaucracy as structured data.
#
# Conventions:
#   - id: unique slug, referenced by depends_on
#   - category: registration | tax | health | finance | immigration | work | family | housing | transport | other
#   - difficulty: 1 (easy) to 5 (nightmare)
#   - priority: 1 (do first) to 5 (do eventually)
#   - channel: online | in_person | mail | phone | mixed
#   - deadline_days: legal or practical deadline from arrival
#   - duration_days: real processing/handling time in working days
#   - cost_eur_min / cost_eur_max: realistic range in EUR
#   - depends_on: list of step ids that must be done first
#   - link: generic fallback URL
#   - link_by_city: override per city
#   - source_urls: authoritative references used to curate this entry

# ----------------------------------------------------------------- pre-arrival

- id: blocked_account
  title_de: Sperrkonto
  title_en: Blocked account
  category: finance
  description_de: Sperrkonto bei einer deutschen Bank für den Visumsantrag.
  description_en: Blocked account at a German bank for the visa application.
  applies_to:
    status: [Non-EU student]
  deadline_days: -60
  duration_days: 3
  cost_eur_min: 50
  cost_eur_max: 150
  difficulty: 2
  priority: 1
  channel: online
  documents:
    - Passport
    - University admission letter
    - Proof of funds (~11,208 EUR per year)
  tips_en:
    - Expatrio, Fintiba, and Coracle are the most common providers for students.
    - The 11,208 EUR figure is updated yearly — check the current requirement.
  tips_de:
    - Expatrio, Fintiba und Coracle sind die gängigsten Anbieter für Studierende.
    - Der Betrag wird jährlich angepasst — aktuellen Wert prüfen.
  link: https://www.auswaertiges-amt.de/en/visa-service
  source_urls:
    - https://www.auswaertiges-amt.de/en/visa-service

- id: visa_application
  title_de: Visumantrag
  title_en: Visa application
  category: immigration
  description_de: Nationales Visum bei der deutschen Botschaft im Heimatland beantragen.
  description_en: Apply for a national visa at the German embassy in your home country.
  applies_to:
    status: [Non-EU student, Non-EU employee]
  deadline_days: -45
  duration_days: 20
  cost_eur_min: 75
  cost_eur_max: 75
  difficulty: 4
  priority: 1
  channel: in_person
  documents:
    - Valid passport
    - Biometric photos
    - Proof of funds or employment contract
    - Health insurance for the initial period
    - Proof of accommodation
    - University admission or job offer
  tips_en:
    - Book the embassy appointment 6–8 weeks ahead.
    - Bring originals and two copies of everything.
  tips_de:
    - Botschaftstermin 6–8 Wochen im Voraus buchen.
    - Originale und zwei Kopien von allem mitbringen.
  link: https://www.auswaertiges-amt.de/en/visa-service
  source_urls:
    - https://www.auswaertiges-amt.de/en/visa-service

- id: document_apostille
  title_de: Apostille
  title_en: Document apostille
  category: immigration
  description_de: Beglaubigung öffentlicher Urkunden für die Anerkennung in Deutschland.
  description_en: Legalisation of public documents for recognition in Germany.
  applies_to:
    status: [Non-EU student, Non-EU employee]
    family: true
  deadline_days: -30
  duration_days: 10
  cost_eur_min: 20
  cost_eur_max: 80
  difficulty: 3
  priority: 2
  channel: in_person
  documents:
    - Birth certificate
    - Marriage certificate (if applicable)
    - University degree
    - Police clearance certificate (if applicable)
  tips_en:
    - Must be done in the country of issue, before departure.
    - Some countries require legalisation at the German embassy on top of the apostille.
  tips_de:
    - Muss im Ausstellungsland vor der Ausreise erfolgen.
    - Manche Länder verlangen zusätzlich eine Legalisation bei der deutschen Botschaft.
  link: https://www.hcch.net/en/instruments/conventions/specialised-sections/apostille
  source_urls:
    - https://www.hcch.net/en/instruments/conventions/specialised-sections/apostille

- id: document_translation
  title_de: Übersetzung
  title_en: Certified translation
  category: immigration
  description_de: Beglaubigte Übersetzung ausländischer Dokumente ins Deutsche.
  description_en: Sworn translation of foreign documents into German.
  applies_to:
    status: [Non-EU student, Non-EU employee]
    family: true
  deadline_days: -30
  duration_days: 5
  cost_eur_min: 30
  cost_eur_max: 120
  difficulty: 2
  priority: 2
  channel: mail
  depends_on: [document_apostille]
  documents:
    - Apostilled originals
    - List of documents to translate
  tips_en:
    - Only sworn translators (beeidigte Übersetzer) are accepted by authorities.
    - Cost is per page — agree on price before submitting.
  tips_de:
    - Nur beeidigte Übersetzer werden von Behörden akzeptiert.
    - Preis pro Seite — vorher vereinbaren.
  link: https://www.bdue.de/
  source_urls:
    - https://www.bdue.de/

- id: health_insurance_pre_arrival
  title_de: Krankenversicherung (Einreise)
  title_en: Health insurance (pre-arrival)
  category: health
  description_de: Reise- oder Übergangsversicherung für die ersten Tage.
  description_en: Travel or bridging insurance for the first days in Germany.
  applies_to:
    all: true
  deadline_days: -5
  duration_days: 1
  cost_eur_min: 30
  cost_eur_max: 120
  difficulty: 1
  priority: 1
  channel: online
  documents:
    - Passport
  tips_en:
    - Required to enter and to register at the Bürgeramt.
    - Public insurance (AOK, TK, Barmer) accepts you on the first day of employment.
  tips_de:
    - Für die Einreise und die Anmeldung erforderlich.
    - Gesetzliche Kassen (AOK, TK, Barmer) nehmen dich ab dem ersten Arbeitstag auf.
  link: https://www.tk.de/
  source_urls:
    - https://www.tk.de/

# ----------------------------------------------------------------- first week

- id: anmeldung
  title_de: Anmeldung
  title_en: Registration at the residents' office
  category: registration
  description_de: Pflicht innerhalb von 14 Tagen nach Einzug. Basis für alles Weitere.
  description_en: Mandatory within 14 days of moving in. Foundation for everything else.
  applies_to:
    all: true
  deadline_days: 14
  duration_days: 1
  cost_eur_min: 0
  cost_eur_max: 0
  difficulty: 2
  priority: 1
  channel: in_person
  documents:
    - Passport or ID
    - Wohnungsgeberbestätigung (landlord confirmation)
    - Filled registration form (Anmeldung form)
  tips_en:
    - Book the appointment 2–4 weeks in advance — slots go fast.
    - Bring the Wohnungsgeberbestätigung signed by your landlord; a printout without signature is rejected.
    - You get the Anmeldung confirmation (Meldebescheinigung) on the spot.
  tips_de:
    - Termin 2–4 Wochen im Voraus buchen — Slots sind schnell weg.
    - Wohnungsgeberbestätigung mit Unterschrift mitbringen; Ausdruck ohne Unterschrift wird abgelehnt.
    - Die Meldebescheinigung gibt es direkt vor Ort.
  phrases:
    - context_de: Beim Empfang
      phrase_de: Ich habe einen Termin zur Anmeldung.
      phrase_en: I have an appointment for registration.
    - context_de: Frage nach der Bestätigung
      phrase_de: Bekomme ich die Meldebescheinigung sofort?
      phrase_en: Do I get the registration certificate immediately?
  link: null
  link_by_city:
    Berlin: https://service.berlin.de/dienstleistung/120686/
    Munich: https://stadt.muenchen.de/service/info/kreisverwaltungsreferat/1084694/
    Hamburg: https://www.hamburg.de/buergeraemter/
    Cologne: https://www.stadt-koeln.de/service/onlinedienste/buergeraemter
    Frankfurt: https://www.frankfurt.de/anmeldung
    Stuttgart: https://www.stuttgart.de/buergeramt
    Düsseldorf: https://www.duesseldorf.de/buergeramt
    Leipzig: https://www.leipzig.de/buergerservice
    Dresden: https://www.dresden.de/buergeraemter
    Nuremberg: https://www.nuernberg.de/einwohneramt
    Hannover: https://www.hannover.de/buergeramt
    Bremen: https://www.bremen.de/buergeraemter
  source_urls:
    - https://www.bmi.bund.de/DE/themen/verfassung/melderecht/melderecht-node.html

- id: bank_account
  title_de: Bankkonto
  title_en: German bank account
  category: finance
  description_de: Deutsches Konto für Miete, Gehalt und Verträge.
  description_en: German account for rent, salary, and contracts.
  applies_to:
    all: true
  deadline_days: 30
  duration_days: 5
  cost_eur_min: 0
  cost_eur_max: 10
  difficulty: 2
  priority: 2
  channel: online
  depends_on: [anmeldung]
  documents:
    - Passport or ID
    - Anmeldung confirmation
  tips_en:
    - N26 and Revolut accept you without Schufa; traditional banks may refuse without credit history.
    - Some employers pay only to a German IBAN.
    - Free accounts exist (Comdirect, DKB) but require income proof.
  tips_de:
    - N26 und Revolut akzeptieren dich ohne Schufa; klassische Banken lehnen ohne Bonität ab.
    - Manche Arbeitgeber zahlen nur auf eine deutsche IBAN.
    - Kostenlose Konten (Comdirect, DKB) brauchen Einkommensnachweis.
  link: https://www.n26.com/
  source_urls:
    - https://www.bafin.de/

- id: tax_id
  title_de: Steuer-ID
  title_en: Tax ID
  category: tax
  description_de: Kommt automatisch per Post nach der Anmeldung.
  description_en: Arrives automatically by mail after Anmeldung.
  applies_to:
    all: true
  deadline_days: 21
  duration_days: 21
  cost_eur_min: 0
  cost_eur_max: 0
  difficulty: 1
  priority: 2
  channel: mail
  depends_on: [anmeldung]
  documents:
    - Anmeldung confirmation
  tips_en:
    - It's a permanent ID issued once, valid for life — do not lose the letter.
    - Your employer needs it for payroll; give it as soon as you receive it.
  tips_de:
    - Wird einmalig ausgestellt und gilt lebenslang — Brief nicht verlieren.
    - Arbeitgeber braucht sie für die Lohnabrechnung.
  link: https://www.bzst.de/DE/Privatpersonen/Steueridentifikationsnummer/steueridentifikationsnummer_node.html
  source_urls:
    - https://www.bzst.de/

- id: rundfunkbeitrag
  title_de: Rundfunkbeitrag
  title_en: Broadcasting fee
  category: finance
  description_de: Pflichtbeitrag pro Haushalt, unabhängig von Nutzung.
  description_en: Mandatory household fee, regardless of actual use.
  applies_to:
    all: true
  deadline_days: 30
  duration_days: 1
  cost_eur_min: 220
  cost_eur_max: 220
  difficulty: 1
  priority: 3
  channel: online
  depends_on: [anmeldung]
  documents:
    - Anmeldung confirmation
    - Bank details (IBAN)
  tips_en:
    - Current rate is 18.36 EUR per month, charged quarterly or annually.
    - One payment per household — if your flatmate already pays, register as "befreit".
    - BAföG and certain social benefits can exempt you.
  tips_de:
    - Aktuell 18,36 EUR/Monat, vierteljährlich oder jährlich abgebucht.
    - Ein Beitrag pro Haushalt — wenn Mitbewohner zahlt, als befreit anmelden.
    - Bei BAföG und bestimmten Sozialleistungen Befreiung möglich.
  link: https://www.rundfunkbeitrag.de/
  source_urls:
    - https://www.rundfunkbeitrag.de/

- id: sim_card
  title_de: SIM-Karte
  title_en: German SIM card
  category: other
  description_de: Deutsche Mobilfunknummer für Behörden und Arbeitgeber.
  description_en: German mobile number for authorities and employer.
  applies_to:
    all: true
  deadline_days: 7
  duration_days: 1
  cost_eur_min: 10
  cost_eur_max: 30
  difficulty: 1
  priority: 2
  channel: in_person
  documents:
    - Passport or ID
  tips_en:
    - Prepaid SIMs require ID verification (Video-Ident or in-store).
    - Aldi Talk, Lidl Connect, and Congstar are cheapest for light use.
  tips_de:
    - Prepaid-SIMs erfordern Ident-Verifizierung (Video-Ident oder im Shop).
    - Aldi Talk, Lidl Connect und Congstar sind am günstigsten für Wenignutzer.
  link: https://www.alditalk.de/
  source_urls:
    - https://www.bundesnetzagentur.de/

- id: health_insurance_activation
  title_de: Krankenversicherung (Aktivierung)
  title_en: Public health insurance activation
  category: health
  description_de: Anmeldung bei einer gesetzlichen Krankenkasse.
  description_en: Enroll with a statutory health insurance fund.
  applies_to:
    status: [EU citizen, Non-EU student, Non-EU employee, Freelancer]
  deadline_days: 90
  duration_days: 10
  cost_eur_min: 0
  cost_eur_max: 0
  difficulty: 2
  priority: 2
  channel: online
  depends_on: [anmeldung]
  documents:
    - Passport or ID
    - Anmeldung confirmation
    - Employment contract or enrollment letter
    - Tax ID (once received)
  tips_en:
    - Contributions are income-based; students pay a fixed reduced rate (~120 EUR/month).
    - Coverage starts retroactively from your first day of employment or enrolment.
  tips_de:
    - Beiträge sind einkommensabhängig; Studierende zahlen einen festen reduzierten Satz.
    - Versicherungsschutz gilt rückwirkend ab dem ersten Arbeitstag oder Semesterbeginn.
  link: https://www.tk.de/
  source_urls:
    - https://www.bundesgesundheitsministerium.de/

# ----------------------------------------------------------------- first month

- id: residence_permit
  title_de: Aufenthaltstitel
  title_en: Residence permit
  category: immigration
  description_de: Aufenthaltserlaubnis bei der Ausländerbehörde beantragen.
  description_en: Apply for a residence permit at the immigration office.
  applies_to:
    status: [Non-EU student, Non-EU employee]
  deadline_days: 90
  duration_days: 60
  cost_eur_min: 100
  cost_eur_max: 110
  difficulty: 5
  priority: 1
  channel: in_person
  depends_on: [anmeldung, health_insurance_activation]
  documents:
    - Passport
    - Anmeldung confirmation
    - Health insurance proof
    - Proof of income or enrollment
    - Biometric photo
    - Visa (current)
    - University admission or employment contract
  tips_en:
    - Book the Ausländerbehörde appointment the day you arrive — waits can be 6–12 weeks.
    - The Fiktionsbescheinigung (bridging permit) keeps you legal while waiting.
    - Bring originals AND copies of everything.
  tips_de:
    - Termin bei der Ausländerbehörde am Ankunftstag buchen — Wartezeiten 6–12 Wochen.
    - Die Fiktionsbescheinigung hält dich während der Wartezeit legal.
    - Originale UND Kopien von allem mitbringen.
  phrases:
    - context_de: Terminvereinbarung
      phrase_de: Ich möchte einen Termin zur Beantragung einer Aufenthaltserlaubnis.
      phrase_en: I'd like an appointment to apply for a residence permit.
    - context_de: Nachfrage zur Fiktionsbescheinigung
      phrase_de: Kann ich eine Fiktionsbescheinigung bekommen, solange der Antrag bearbeitet wird?
      phrase_en: Can I get a bridging permit while the application is processed?
  link: null
  link_by_city:
    Berlin: https://www.berlin.de/einwanderung/
    Munich: https://stadt.muenchen.de/service/info/kreisverwaltungsreferat/1077490/
    Hamburg: https://www.hamburg.de/einwanderung/
    Cologne: https://www.stadt-koeln.de/service/produkte/11147/index.html
    Frankfurt: https://www.frankfurt.de/auslaenderbehoerde
    Stuttgart: https://www.stuttgart.de/auslaenderbehoerde
    Düsseldorf: https://www.duesseldorf.de/auslaenderamt
    Leipzig: https://www.leipzig.de/auslaenderbehoerde
    Dresden: https://www.dresden.de/auslaenderbehoerde
    Nuremberg: https://www.nuernberg.de/auslaenderbehoerde
    Hannover: https://www.hannover.de/auslaenderbehoerde
    Bremen: https://www.bremen.de/auslaenderbehoerde
  source_urls:
    - https://www.make-it-in-germany.com/en/visa-residence/
    - https://www.bamf.de/

- id: blue_card
  title_de: Blaue Karte EU
  title_en: EU Blue Card
  category: immigration
  description_de: Aufenthaltstitel für Akademiker mit Jobangebot über der Gehaltsgrenze.
  description_en: Residence permit for graduates with a job offer above the salary threshold.
  applies_to:
    status: [Non-EU employee]
  deadline_days: 90
  duration_days: 45
  cost_eur_min: 100
  cost_eur_max: 110
  difficulty: 4
  priority: 1
  channel: in_person
  depends_on: [anmeldung, health_insurance_activation]
  documents:
    - Passport
    - Employment contract (salary threshold met)
    - Recognised university degree
    - Health insurance
    - Anmeldung confirmation
    - CV
  tips_en:
    - 2025 threshold ~48,300 EUR/year general; ~43,759 EUR for shortage occupations.
    - Faster path to permanent residence than a standard work permit.
  tips_de:
    - Gehaltsgrenze 2025 ca. 48.300 EUR/Jahr allgemein; 43.759 EUR für Engpassberufe.
    - Schnellerer Weg zur Niederlassungserlaubnis als eine normale Arbeitserlaubnis.
  link: https://www.make-it-in-germany.com/en/visa-residence/types/blue-card
  source_urls:
    - https://www.make-it-in-germany.com/

- id: professional_recognition
  title_de: Anerkennung des Abschlusses
  title_en: Professional degree recognition
  category: work
  description_de: Anerkennung ausländischer Qualifikationen durch die zuständige Stelle.
  description_en: Recognition of foreign qualifications by the competent authority.
  applies_to:
    status: [Non-EU employee, Non-EU student]
  deadline_days: 180
  duration_days: 90
  cost_eur_min: 100
  cost_eur_max: 600
  difficulty: 4
  priority: 3
  channel: mail
  documents:
    - Diploma and transcripts (certified)
    - Translations (German)
    - CV
    - Proof of work experience
  tips_en:
    - Check anabin database first to see if your degree is automatically recognised.
    - Regulated professions (medicine, law, teaching) require full recognition.
  tips_de:
    - Zuerst die Anabin-Datenbank prüfen — dort steht, ob dein Abschluss automatisch anerkannt wird.
    - Reglementierte Berufe (Medizin, Recht, Lehramt) benötigen volle Anerkennung.
  link: https://www.anerkennung-in-deutschland.de/
  source_urls:
    - https://www.anerkennung-in-deutschland.de/

- id: elster_account
  title_de: ELSTER-Konto
  title_en: ELSTER tax account
  category: tax
  description_de: Online-Konto beim Finanzamt für Steuererklärungen.
  description_en: Online account with the tax office for tax filings.
  applies_to:
    all: true
  deadline_days: 60
  duration_days: 10
  cost_eur_min: 0
  cost_eur_max: 0
  difficulty: 3
  priority: 3
  channel: online
  depends_on: [tax_id]
  documents:
    - Tax ID
    - Bank details
  tips_en:
    - Activation code arrives by mail in 1–2 weeks.
    - Required for freelancers and for anyone itemising deductions.
  tips_de:
    - Aktivierungscode kommt per Post in 1–2 Wochen.
    - Erforderlich für Freiberufler und alle mit Werbungskosten.
  link: https://www.elster.de/
  source_urls:
    - https://www.elster.de/

- id: pension_registration
  title_de: Rentenversicherung
  title_en: Pension registration
  category: finance
  description_de: Automatische Anmeldung durch den Arbeitgeber.
  description_en: Automatic registration by your employer.
  applies_to:
    status: [EU citizen, Non-EU employee]
  deadline_days: 90
  duration_days: 30
  cost_eur_min: 0
  cost_eur_max: 0
  difficulty: 1
  priority: 4
  channel: mixed
  depends_on: [anmeldung, tax_id]
  documents:
    - Employment contract
    - Tax ID
    - Social security number (arrives by mail)
  tips_en:
    - Contributions are split 50/50 with your employer.
    - You can request a statement of contributions (Versicherungsverlauf) any time.
    - Refunds possible if you leave Germany within 5 years.
  tips_de:
    - Beiträge werden 50/50 mit dem Arbeitgeber geteilt.
    - Versicherungsverlauf kann jederzeit angefordert werden.
    - Beitragserstattung möglich bei Ausreise innerhalb von 5 Jahren.
  link: https://www.deutsche-rentenversicherung.de/
  source_urls:
    - https://www.deutsche-rentenversicherung.de/

- id: church_tax
  title_de: Kirchensteuer
  title_en: Church tax
  category: tax
  description_de: Optional. 8–9 % der Einkommensteuer für Kirchenmitglieder.
  description_en: Optional. 8–9 % of income tax for registered church members.
  applies_to:
    all: true
  deadline_days: 90
  duration_days: 1
  cost_eur_min: 0
  cost_eur_max: 0
  difficulty: 2
  priority: 5
  channel: in_person
  depends_on: [anmeldung, tax_id]
  documents:
    - Anmeldung confirmation
    - Tax ID
  tips_en:
    - Catholics and Protestants are auto-enrolled unless they formally leave the church.
    - Leaving (Kirchenaustritt) costs 20–40 EUR at the Standesamt.
  tips_de:
    - Katholiken und Protestanten werden automatisch erfasst, wenn sie nicht formell austreten.
    - Kirchenaustritt kostet 20–40 EUR beim Standesamt.
  link: https://www.bzst.de/
  source_urls:
    - https://www.bzst.de/

- id: freelancer_tax
  title_de: Fragebogen zur steuerlichen Erfassung
  title_en: Freelancer tax registration
  category: tax
  description_de: Steuerliche Erfassung beim Finanzamt als Selbstständiger.
  description_en: Tax registration with the Finanzamt as a freelancer.
  applies_to:
    status: [Freelancer]
  deadline_days: 30
  duration_days: 14
  cost_eur_min: 0
  cost_eur_max: 0
  difficulty: 3
  priority: 2
  channel: online
  depends_on: [anmeldung, tax_id]
  documents:
    - Steuer-ID
    - Description of activity
    - Estimated income
  tips_en:
    - Submit via ELSTER within one month of starting activity.
    - You receive a Steuernummer (tax number) for invoices.
  tips_de:
    - Über ELSTER innerhalb eines Monats nach Tätigkeitsbeginn einreichen.
    - Du erhältst eine Steuernummer für Rechnungen.
  link: https://www.elster.de/
  source_urls:
    - https://www.elster.de/

- id: gewerbeanmeldung
  title_de: Gewerbeanmeldung
  title_en: Business registration
  category: work
  description_de: Für Gewerbetreibende, nicht für freie Berufe.
  description_en: For commercial businesses, not liberal professions.
  applies_to:
    status: [Freelancer]
  deadline_days: 14
  duration_days: 3
  cost_eur_min: 20
  cost_eur_max: 60
  difficulty: 3
  priority: 2
  channel: in_person
  depends_on: [anmeldung]
  documents:
    - Passport or ID
    - Anmeldung confirmation
    - Description of activity
  tips_en:
    - Not required for liberal professions (doctors, lawyers, journalists, engineers, teachers).
    - You will be notified to the IHK or HWK for chamber membership.
  tips_de:
    - Nicht nötig für freie Berufe (Ärzte, Anwälte, Journalisten, Ingenieure, Lehrer).
    - Du wirst bei IHK oder HWK als Kammermitglied gemeldet.
  link: https://www.gruenderplattform.de/
  source_urls:
    - https://www.gruenderplattform.de/

# ----------------------------------------------------------------- first three months

- id: kfz_anmeldung
  title_de: Kfz-Anmeldung
  title_en: Car registration
  category: transport
  description_de: Zulassung eines Fahrzeugs in Deutschland.
