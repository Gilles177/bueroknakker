name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install DejaVu fonts (for PDF export tests)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Copy DejaVu fonts into src/fonts
        run: |
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf src/fonts/
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf src/fonts/

      - name: Run tests
        run: pytest -q
